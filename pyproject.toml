[project]
name = "liulian-ingest"
version = "0.1.0"
description = "Crawler services for LIULIAN data ingestion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# [fix 2026-06-28] flat layout: the package lives in crawler/ at the repo root, not src/crawler —
# the src/ path never existed, so the editable build failed and no deps installed.
packages = ["crawler"]

[tool.hatch.build.targets.wheel.force-include]
# [fix 2026-06-28] drop the non-existent src/ prefix; these data files live under crawler/.
"crawler/schemas/_java_columns.json" = "crawler/schemas/_java_columns.json"
"crawler/extractor/prompts/about.txt" = "crawler/extractor/prompts/about.txt"
"crawler/extractor/prompts/field_group.txt" = "crawler/extractor/prompts/field_group.txt"
# [disabled 2026-06-28] sources.yaml / data_dictionary.yaml do NOT exist in the repo (config/ is
# empty); hatchling errors on a missing force-include source, which blocked the whole build. The
# runtime default path (crawler/agents/source_selector.py: _DEFAULT_CONFIG_DIR/sources.yaml) also
# can't find them — a separate gap tracked as the F0-ingest-packaging card. Re-enable when restored.
# "config/sources.yaml" = "crawler/config/sources.yaml"
# "config/data_dictionary.yaml" = "crawler/config/data_dictionary.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # [fix 2026-06-28] flat layout (crawler/ at root), not src/

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."  # [fix 2026-06-28] flat layout (crawler/ at root), not src/

[tool.ruff]
line-length = 100
target-version = "py312"
